services:
  mongo:
    image: mongo:8
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - bep_nha_data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "try { quit(db.hello().isWritablePrimary ? 0 : (rs.status(), 1)); } catch (e) { if (e.code === 94) rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]}); quit(1); }"
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bep_nha_data:

